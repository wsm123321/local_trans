[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "region_guided_reranking_study"
version = "0.8.0"
description = "Source local-structure extraction, target-calibrated local-surrogate transfer, and region-guided expensive optimization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
